
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: #0066cc;
        }
        a:hover {
            text-decoration: underline;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
            position: fixed;
            top: 0;
             left: 0;
            width: 100%;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #333;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
        }
        nav ul li a {
            color: #555;
            font-size: 14px;
            font-weight: bold;
        }
        nav ul li a:hover {
            color: #0066cc;
        }

        main {
            max-width: 900px;
            margin: 80px auto 40px auto;
            padding: 20px;
        }
        section {
            background: #ffffff;
            margin-bottom: 25px;
            padding: 30px;
            border: 1px solid #e1e1e1;
            border-radius: 6px;
        }
        h2 {
            margin-bottom: 15px;
            color: #222;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 5px;
            display: inline-block;
        }

        #home {
            display: flex;
            align-items: center;
            gap: 30px;
            background: linear-gradient(to right, #ffffff, #f0f4f8);
        }
        .home-text h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #111;
        }
        .home-text p {
            color: #666;
            margin-bottom: 15px;
        }
        .photo-box {
            width: 150px;
            height: 150px;
            background-color: #ddd;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #0066cc;
            flex-shrink: 0;
        }
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
                        <h1> INTRODUCTION</h1>
                        <p>Hello! My name is Vishakha. I am a passionate web developer with a keen interest in creating dynamic and user-friendly websites. I have experience in various programming languages and web technologies, and I am always eager to learn and explore new tools and frameworks. My goal is to build innovative web applications that provide seamless user experiences. I am currently pursuing my studies in computer science and I am excited to contribute to the tech community through my projects and collaborations.</p>
                    </style>

<body>
